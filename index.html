<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <div class="auth-container">
    <h2>เข้าสู่ระบบ</h2>
  <form class="auth-form" onsubmit="login(); return false;">
    <input type="text" id="username" placeholder="ชื่อผู้ใช้" />
    <input type="password" id="password" placeholder="รหัสผ่าน" />
    <button type="submit">เข้าสู่ระบบ</button>
  </form>
  <p class="switch-link">ยังไม่มีบัญชี? <a href="register.html">สมัครสมาชิก</a></p>
  <div style="margin-top: 20px; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 8px; font-size: 0.9em; text-align: left; border: 1px solid rgba(255,255,255,0.2);">
    <strong style="display:block; margin-bottom:10px; color:#ddd;">ทดลองใช้งาน (Test Accounts):</strong>
    <p style="margin: 5px 0; color:#ddd;">👤 Username: <b>john123</b> <br>🔑 Password: <b>123</b></p>
    <p style="margin: 5px 0; margin-top: 10px; color:#ddd;">👤 Username: <b>alex01</b> <br>🔑 Password: <b>1234</b></p>
  </div>
  <!-- ตรวจสอบให้แน่ใจว่าใน HTML มี id ที่ตรงกับนี้ -->
  <p id="profileName" style="display: none;"></p>
  <p id="profileDesc" style="display: none;"></p>
  </div>
  


  <script src="user.js"></script>
</body>
</html>
