<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>สมัครสมาชิก</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="auth-container">
    <h2>สมัครสมาชิก</h2>
    <form class="auth-form" onsubmit="register(event); return false;">
      <input type="text" id="newUsername" placeholder="ชื่อผู้ใช้" required/>
      <input type="password" id="newPassword" placeholder="รหัสผ่าน" required/>
      <div class="form-group">
        <!-- <label for="role">บทบาทผู้ใช้</label> -->
        <!-- <select id="role" required>
          <option value="" disabled selected>เลือกบทบาท</option>
          <option value="user">ผู้ใช้</option>
          <option value="admin">ผู้ดูแล</option>
        </select> -->
      </div>
      <button type="submit">สมัคร</button>
    </form>
    <p class="switch-link" >มีบัญชีอยู่แล้ว? <a href="index.html">เข้าสู่ระบบ</a></p>
</div>
  <script src="register.js"></script>
</body>
</html>
