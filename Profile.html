<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>หน้าโปรไฟล์</title>
    <link href="./Profile.css" rel="stylesheet" />
    <link rel="stylesheet" href="./main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
      table {
        width: 95%;
        border-collapse: collapse;
        overflow-y: auto;
      }

      th, td {
        padding: 8px 12px;
        border: 1px solid #b9b9b9;
        text-align: left;
        border-radius: 5px;
      }

      tr:hover {
        background-color: #f3f3f3;
      }

      /* แถวเลขคี่ (1, 3, 5, ...) เป็นสีขาว */
      tr:nth-child(odd) {
        background-color: #fafafa;
      }

      tr:nth-child(odd):hover {
        background-color: #f3f3f3;
      }

      /* แถวเลขคู่ (2, 4, 6, ...) เป็นสีเทา */
      tr:nth-child(even) {
        background-color: #ffffff;
      }

      tr:nth-child(even):hover {
          background-color: #c0c0c0;
        }

      .buttonClick {
        padding: 10px 20px;
        font-size: 1rem;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        margin: 10px 0;
        background: linear-gradient(135deg, #667eea, #764ba2); 
        color: white;
        transition: background-color 0.3s ease, transform 0.3s ease;
      }

      .buttonClick:hover {
        background: linear-gradient(135deg, #5a6dde, #693c94);
        transform: scale(1.1);
      }

      /* จัดระเบียบให้ปุ่มไปขวามือ */
      td {
        display: flex;
        justify-content: space-between; /* จัดระเบียบให้ปุ่มไปขวามือ */
        align-items: center; /* จัดระเบียบให้ปุ่มไปขวามือ */
      }
      .table-container {
        display: flex;
        justify-content: center; /* จัดตำแหน่งในแนวนอน */
        align-items: center; /* จัดตำแหน่งในแนวตั้ง */
        padding: 20px;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <div class="menu-icon" id="menu-icon">
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
        </div>

        <div class="sidebar" id="sidebar">
          <ul>
            <li><a href="./Page/Form.html" class="link , song-title">แบบสอบถาม</a></li>
            <li><span class="logout , song-title" style="color: white;">Logout</span></li>
          </ul>
        </div>
      </div>

      <div class="logo">
        <h1>Profile</h1>
      </div>

      <nav>
        <ul class="headerul">
          <li class="headerli"><a href="./Home.html" class="link , song-title" style="color: white;">Home</a></li>
          <li class="headerli">
            <a href="./Profile.html" class="link , song-title" style="color: white;">Profile</a>
          </li>
        </ul>
      </nav>
    </header>

    <!-- ส่วนหัวโปรไฟล์ -->
    <div class="profile-header" id="coverImg">
      <button class="edit-btn" onclick="openModalPic()">แก้ไขรูปภาพ</button>
      <div class="profile-img" id="profileImg"></div>
    </div>    

    <!-- เนื้อหาโปรไฟล์ -->
    <div class="container">
      <div class="profile-info">
        <div>
          <h1 id="profileName">ชื่อผู้ใช้</h1>
          <p id="profileDesc">คำอธิบายเกี่ยวกับผู้ใช้</p>
        </div>
        <button class="edit-btn" onclick="openModal()">แก้ไขโปรไฟล์</button>
      </div>

      <div class="section">
        <h3>My Playlists</h3>
        <div class="gridContainer">
          <div class="playlist-grid" id="favoritesGrid"></div>
          <div class="playlist-grid" id="playlistGrid"></div>
        </div>
      </div>

      <div style="text-align: center; margin: 20px">
        <div id="playlistPopup" class="popup2">
          <div class="popup-content2">
            <span class="close" onclick="closePopup()">&times;</span>
            <h2 id="popupTitle"  style="text-align: center;">ชื่อเพลย์ลิสต์</h2>
            <div id="popupSongs" class="song-title"></div>
          </div>
        </div>
      </div>

      
      <div style="text-align: center; margin: 20px">
        <div id="favoritesPopup" class="popup2">
          <div class="popup-content2">
            <span class="close" onclick="closefavoritesPopup()">&times;</span>
            <h2 id="favoritesTitle" style="text-align: center;">รายการโปรด</h2>
            <div id="favoritesSongs" class="song-title" ></div>
          </div>
        </div>
      </div>

    <!-- แถบตัวเล่นเพลง -->
    <div class="slide-window" id="slideWindow">
      <span class="closewindow" onclick="closeSlideWindow()">&times;</span>
      <div class="content" id="content">
        <!-- แถวควบคุมเพลง -->
        <div class="control-row">
          <button onclick="previousSong()" class="runbutton , bi-skip-backward-fill"></button>
          <div class="center-controls">
            <p id="songTitle" class="song-title">ชื่อเพลง</p>
          </div>
          <button onclick="nextSong()" class="runbutton ,  bi-skip-forward-fill"></button>
        </div> 
        <!-- ตัวเล่นเพลง -->
        <audio id="audioPlayer" controls style="margin-top: 25px;">
          <source id="audioSource" src="" type="audio/mp3" />
          Your browser does not support the audio element.
        </audio>
      </div>
    </div>

    <!-- Modal แก้ไขโปรไฟล์ -->
    <div class="modal" id="editModal">
      <div class="modal-content">
        <h3>แก้ไขโปรไฟล์</h3>
        <input type="text" id="editName" placeholder="ชื่อผู้ใช้" />
        <textarea id="editDesc" placeholder="คำอธิบาย..." rows="3"></textarea>
        <div class="modal-footer">
          <button id="saveButton" class="btn save" onclick="editProfile()">บันทึก</button>
          <button class="btn cancel" onclick="closeModal()">ยกเลิก</button>
        </div>
      </div>
    </div>

        <!-- Modal แก้ไขรูป-->
        <div class="modal" id="editPic">
          <div class="modal-content">
            <h3>แก้ไขโปรไฟล์</h3>
            
            <label>เลือกรูปโปรไฟล์</label>
            <input type="file" id="editProfileImgFile" accept="image/*" />
            
            <label>เลือกรูปปกพื้นหลัง</label>
            <input type="file" id="editCoverImgFile" accept="image/*" />
        
            <div class="modal-footer">
              <button id="saveButton" class="btn save" onclick="editPic()">บันทึก</button>
              <button class="btn cancel" onclick="closePic()">ยกเลิก</button>
            </div>
          </div>
        </div>
        

        <script src="slide.js"></script>
        <script src="songData.js"></script>
        <script src="user.js"></script>
        <script src="./Profile.js"></script>
      </body>
</html>
